
<style>
*{box-sizing:border-box;margin:0;padding:0}
.app{font-family:var(--font-sans);max-width:420px;margin:0 auto}
.topbar{background:#1A1A2E;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-radius:var(--border-radius-lg) var(--border-radius-lg) 0 0}
.topbar-title{color:#D4AF37;font-size:16px;font-weight:500}
.topbar-count{color:#D4AF37;opacity:0.7;font-size:13px}
.toolbar{padding:10px 12px 6px;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);position:sticky;top:0;z-index:20}
.search-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.search-row input{flex:1;font-size:14px;padding:7px 10px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:#fff;color:#111}
.add-btn{flex-shrink:0;background:#1A1A2E;color:#D4AF37;border:none;border-radius:var(--border-radius-md);padding:7px 12px;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:4px}
.filter-row{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filter-row::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:4px 10px;border-radius:999px;font-size:12px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary);cursor:pointer}
.chip.active{background:#1A1A2E;color:#D4AF37;border-color:#1A1A2E}
.count-bar{padding:6px 12px 2px;font-size:12px;color:var(--color-text-tertiary)}
.list{padding:8px 12px 2rem;display:flex;flex-direction:column;gap:8px}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;cursor:pointer}
.card-name{font-size:14px;font-weight:500;color:var(--color-text-primary)}
.card-sub{font-size:12px;color:var(--color-text-secondary);margin-top:1px}
.card-right{display:flex;align-items:center;gap:6px}
.badge{font-size:11px;padding:3px 8px;border-radius:999px;background:#1A1A2E;color:#D4AF37;white-space:nowrap}
.chevron{font-size:15px;color:var(--color-text-tertiary);transition:transform 0.18s}
.chevron.open{transform:rotate(180deg)}
.card-body{display:none;border-top:0.5px solid var(--color-border-tertiary);padding:12px 13px}
.card-body.open{display:block}
.sec-label{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:0.07em;color:var(--color-text-tertiary);margin-bottom:3px}
.sec-val{font-size:13px;color:var(--color-text-primary);line-height:1.5;margin-bottom:10px}
.ing-list{display:flex;flex-direction:column;gap:1px;margin-bottom:10px}
.ing-item{font-size:13px;padding:4px 0;border-bottom:0.5px solid var(--color-border-tertiary);color:var(--color-text-primary)}
.ing-item:last-child{border-bottom:none}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.instr-box{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:9px 11px;font-size:13px;color:var(--color-text-primary);line-height:1.6;margin-bottom:10px}
.action-row{display:flex;gap:8px}
.btn-edit{flex:1;background:var(--color-background-secondary);color:var(--color-text-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:7px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
.btn-delete{background:#fff0f0;color:#c0392b;border:0.5px solid #f5c6c6;border-radius:var(--border-radius-md);padding:7px 12px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:4px}
.no-results{text-align:center;padding:3rem 1rem;color:var(--color-text-secondary);font-size:14px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#ffffff;color:#111;border-radius:var(--border-radius-lg) var(--border-radius-lg) 0 0;width:100%;max-width:420px;max-height:92vh;overflow-y:auto;padding:20px 16px 32px}
.modal-title{font-size:16px;font-weight:600;color:#111;margin-bottom:16px}
.field-label{font-size:12px;color:#555;margin-bottom:4px;margin-top:12px;font-weight:500}
.field-label:first-of-type{margin-top:0}
.modal input,.modal select,.modal textarea{width:100%;font-size:15px;padding:9px 11px;border-radius:8px;border:1.5px solid #ccc;background:#fff;color:#111;font-family:inherit;outline:none;-webkit-appearance:none}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:#1A1A2E;box-shadow:0 0 0 2px rgba(26,26,46,0.1)}
.modal textarea{resize:vertical;min-height:80px;line-height:1.5}
.ing-editor{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.ing-row{display:flex;gap:6px;align-items:center}
.ing-row input{flex:1}
.rm-btn{flex-shrink:0;background:#fff0f0;color:#c0392b;border:1.5px solid #f5c6c6;border-radius:8px;padding:8px 10px;font-size:14px;cursor:pointer;line-height:1;display:flex;align-items:center}
.add-ing-btn{background:#f5f5f5;color:#333;border:1.5px solid #ddd;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer;margin-top:4px;text-align:left;width:100%;display:flex;align-items:center;gap:6px}
.divider{height:1px;background:#eee;margin:14px 0}
.modal-actions{display:flex;gap:8px;margin-top:20px}
.btn-save{flex:1;background:#1A1A2E;color:#D4AF37;border:none;border-radius:8px;padding:12px;font-size:15px;font-weight:600;cursor:pointer}
.btn-cancel{background:#f0f0f0;color:#444;border:1.5px solid #ccc;border-radius:8px;padding:12px 16px;font-size:15px;cursor:pointer}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1A1A2E;color:#D4AF37;padding:9px 20px;border-radius:999px;font-size:13px;z-index:200;opacity:0;transition:opacity 0.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>

<div class="app">
  <div class="topbar">
    <span class="topbar-title">🍸 Cocktail Library</span>
    <span class="topbar-count" id="topbar-count"></span>
  </div>
  <div class="toolbar">
    <div class="search-row">
      <i class="ti ti-search" style="font-size:16px;color:var(--color-text-tertiary)"></i>
      <input type="text" id="search" placeholder="Search cocktails or ingredients…" oninput="render()" autocomplete="off"/>
      <button class="add-btn" onclick="openModal(null)"><i class="ti ti-plus"></i> Add</button>
    </div>
    <div class="filter-row" id="filters"></div>
  </div>
  <div class="count-bar" id="count-bar"></div>
  <div class="list" id="list"></div>
</div>

<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal-inner">
    <div class="modal-title" id="modal-title">Add cocktail</div>
    <div class="field-label">Name *</div>
    <input type="text" id="f-name" placeholder="e.g. Dark & Stormy" autocomplete="off"/>
    <div class="field-label">Base spirit</div>
    <input type="text" id="f-spirit" placeholder="e.g. Rum" autocomplete="off"/>
    <div class="field-label">Method</div>
    <select id="f-method">
      <option>Shake</option><option>Stir</option><option>Build</option><option>Muddle</option><option>Blend</option><option>Other</option>
    </select>
    <div class="divider"></div>
    <div class="field-label">Glassware</div>
    <input type="text" id="f-glass" placeholder="e.g. Highball" autocomplete="off"/>
    <div class="field-label">Garnish</div>
    <input type="text" id="f-garnish" placeholder="e.g. Lime wedge" autocomplete="off"/>
    <div class="field-label">Ice</div>
    <input type="text" id="f-ice" placeholder="e.g. Cubes" autocomplete="off"/>
    <div class="divider"></div>
    <div class="field-label">Ingredients *</div>
    <div class="ing-editor" id="ing-editor"></div>
    <button class="add-ing-btn" onclick="addIngRow('')"><i class="ti ti-plus"></i> Add ingredient</button>
    <div class="divider"></div>
    <div class="field-label">Instructions</div>
    <textarea id="f-instructions" placeholder="Step-by-step instructions…"></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" id="save-btn" onclick="saveModal()">Save cocktail</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

  {id:"46",name:"Standard Martini",spirit:"Gin",method:"Stir",glass:"Martini / Nick & Nora",garnish:"Lemon twist, olive on request",ice:"Up",ingredients:["2 oz Bombay Dry Gin","1 oz Martini & Rossi Dry Vermouth"],instructions:"Stir gin and vermouth with ice 30–45 sec. Strain into chilled glass."},
  {id:"47",name:"Tom Collins",spirit:"Gin",method:"Build",glass:"Collins glass",garnish:"Lemon wheel, cherry",ice:"Cubes",ingredients:["2 oz Gray Whale Gin","0.75 oz simple syrup","0.75 oz lemon juice","Fever-Tree Club Soda (top)"],instructions:"Add gin, syrup and lemon. Fill with ice, top with club soda, stir."},
  {id:"48",name:"Vesper",spirit:"Gin / Vodka",method:"Shake",glass:"Coupe / Nick & Nora",garnish:"Lemon twist",ice:"Up",ingredients:["3 oz Hendrick's Gin","1 oz Grey Goose Vodka","0.5 oz Lillet Blanc"],instructions:"Shake vigorously 20–30 sec. Strain into chilled glass. Express lemon twist over drink."},
  {id:"49",name:"Vieux Carré",spirit:"Rye / Cognac",method:"Stir",glass:"Rocks glass",garnish:"Lemon twist",ice:"Cubes",ingredients:["0.75 oz Sazerac Rye Whiskey","0.75 oz Remy Martin VSOP Cognac","0.75 oz Martini & Rossi Rosso Vermouth","2 barspoons Benedictine","2 dashes Angostura Bitters","2 dashes Peychaud's Bitters"],instructions:"Stir all with ice until chilled. Strain into rocks glass over fresh ice."},
  {id:"50",name:"Vodka Martini",spirit:"Vodka",method:"Stir",glass:"Martini / Nick & Nora",garnish:"Lemon twist, olive on request",ice:"Up",ingredients:["2.5 oz Ketel One Vodka","0.5 oz Martini & Rossi Dry Vermouth"],instructions:"Stir with ice 30–45 sec. Strain into chilled glass."},
  {id:"51",name:"Whiskey Sour",spirit:"Whiskey",method:"Shake",glass:"Rocks glass",garnish:"3–4 dashes Angostura Bitters",ice:"Cubes",ingredients:["2 oz Jack Daniel's Tennessee Whiskey","0.75 oz simple syrup","0.75 oz lemon juice","1 egg white"],instructions:"Dry-shake all 30 sec. Add ice, shake 15–20 sec. Strain over fresh ice."}
];

let cocktails = [];
let openId = null;
let editingId = null;
let activeMethod = "All";
let activeSpirit = "All";

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function showToast(msg, duration) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), duration || 2200);
}

async function persistSave() {
  const json = JSON.stringify(cocktails);
  let ok = false;
  try {
    const result = await window.storage.set(STORAGE_KEY, json);
    ok = !!result;
  } catch(e) {
    ok = false;
  }
  return ok;
}

async function load() {
  let loaded = false;
  try {
    const r = await window.storage.get(STORAGE_KEY);
    if (r && r.value) {
      const parsed = JSON.parse(r.value);
      if (Array.isArray(parsed) && parsed.length > 0) {
        cocktails = parsed;
        loaded = true;
      }
    }
  } catch(e) {}

  if (!loaded) {
    cocktails = DEFAULT.map(c => ({...c}));
    // seed storage on first load
    try { await window.storage.set(STORAGE_KEY, JSON.stringify(cocktails)); } catch(e) {}
  }
  render();
}

function getFiltered() {
  const q = (document.getElementById("search") || {value:""}).value.toLowerCase().trim();
  return cocktails.filter(c => {
    const mOk = activeMethod === "All" || c.method === activeMethod;
    const sOk = activeSpirit === "All" || (c.spirit || "").includes(activeSpirit);
    const qOk = !q || c.name.toLowerCase().includes(q)
      || (c.spirit || "").toLowerCase().includes(q)
      || (c.ingredients || []).some(i => i.toLowerCase().includes(q));
    return mOk && sOk && qOk;
  });
}

function buildFilters() {
  const ms = ["All","Shake","Stir","Build","Muddle","Blend","Other"];
  const ss = ["All","Gin","Vodka","Rum","Whiskey","Bourbon","Rye Whiskey","Tequila","Scotch","Mezcal","Cognac","Aperol","Campari","Cachaça"];
  const el = document.getElementById("filters");
  if (!el) return;
  let h = ms.map(m => `<span class="chip${activeMethod===m?" active":""}" onclick="setF('method','${m}')">${m}</span>`).join("");
  h += `<span style="color:var(--color-border-secondary);align-self:center;flex-shrink:0;padding:0 2px">|</span>`;
  h += ss.map(s => `<span class="chip${activeSpirit===s?" active":""}" onclick="setF('spirit','${s}')">${s==="All"?"All spirits":s}</span>`).join("");
  el.innerHTML = h;
}

function setF(g, v) {
  if (g === "method") activeMethod = v;
  else activeSpirit = v;
  openId = null;
  render();
}

function toggle(id) {
  openId = openId === id ? null : id;
  render();
}

function render() {
  buildFilters();
  const filtered = getFiltered();
  const cb = document.getElementById("count-bar");
  const te = document.getElementById("topbar-count");
  if (cb) cb.textContent = filtered.length + " cocktail" + (filtered.length !== 1 ? "s" : "");
  if (te) te.textContent = cocktails.length + " total";
  const list = document.getElementById("list");
  if (!list) return;
  if (!filtered.length) { list.innerHTML = `<div class="no-results">No cocktails found</div>`; return; }
  list.innerHTML = filtered.map(c => {
    const open = openId === c.id;
    return `<div class="card">
      <div class="card-head" onclick="toggle('${c.id}')">
        <div>
          <div class="card-name">${c.name}</div>
          <div class="card-sub">${c.glass || ""}${c.spirit ? " · " + c.spirit : ""}</div>
        </div>
        <div class="card-right">
          <span class="badge">${c.method || ""}</span>
          <i class="ti ti-chevron-down chevron${open ? " open" : ""}"></i>
        </div>
      </div>
      ${open ? `<div class="card-body open">
        <div class="sec-label">Ingredients</div>
        <div class="ing-list">${(c.ingredients||[]).map(i=>`<div class="ing-item">${i}</div>`).join("")}</div>
        <div class="meta-grid">
          <div><div class="sec-label">Glass</div><div class="sec-val">${c.glass||"—"}</div></div>
          <div><div class="sec-label">Garnish</div><div class="sec-val">${c.garnish||"—"}</div></div>
          <div><div class="sec-label">Ice</div><div class="sec-val">${c.ice||"—"}</div></div>
          <div><div class="sec-label">Spirit</div><div class="sec-val">${c.spirit||"—"}</div></div>
        </div>
        ${c.instructions ? `<div class="sec-label">Instructions</div><div class="instr-box">${c.instructions}</div>` : ""}
        <div class="action-row">
          <button class="btn-edit" onclick="event.stopPropagation();openModal('${c.id}')"><i class="ti ti-edit"></i> Edit</button>
          <button class="btn-delete" onclick="event.stopPropagation();deleteCocktail('${c.id}')"><i class="ti ti-trash"></i></button>
        </div>
      </div>` : ""}
    </div>`;
  }).join("");
}

function addIngRow(val) {
  const ed = document.getElementById("ing-editor");
  if (!ed) return;
  const row = document.createElement("div");
  row.className = "ing-row";
  const inp = document.createElement("input");
  inp.type = "text";
  inp.value = val;
  inp.placeholder = "e.g. 2 oz Hendrick's Gin";
  inp.autocomplete = "off";
  const btn = document.createElement("button");
  btn.className = "rm-btn";
  btn.type = "button";
  btn.innerHTML = '<i class="ti ti-x"></i>';
  btn.onclick = () => row.remove();
  row.appendChild(inp);
  row.appendChild(btn);
  ed.appendChild(row);
}

function openModal(id) {
  editingId = id || null;
  const c = id ? cocktails.find(x => x.id === id) : null;
  document.getElementById("modal-title").textContent = c ? "Edit cocktail" : "Add cocktail";
  document.getElementById("f-name").value = c ? c.name : "";
  document.getElementById("f-spirit").value = c ? (c.spirit || "") : "";
  document.getElementById("f-method").value = c ? (c.method || "Shake") : "Shake";
  document.getElementById("f-glass").value = c ? (c.glass || "") : "";
  document.getElementById("f-garnish").value = c ? (c.garnish || "") : "";
  document.getElementById("f-ice").value = c ? (c.ice || "") : "";
  document.getElementById("f-instructions").value = c ? (c.instructions || "") : "";
  const ed = document.getElementById("ing-editor");
  ed.innerHTML = "";
  const ings = c ? c.ingredients : ["", "", ""];
  ings.forEach(i => addIngRow(i));
  document.getElementById("modal-bg").classList.add("open");
}

function closeModal() {
  document.getElementById("modal-bg").classList.remove("open");
  editingId = null;
}

async function saveModal() {
  const saveBtn = document.getElementById("save-btn");
  const name = document.getElementById("f-name").value.trim();
  if (!name) { showToast("⚠️ Name is required"); return; }

  saveBtn.textContent = "Saving…";
  saveBtn.disabled = true;

  const ings = Array.from(document.querySelectorAll("#ing-editor .ing-row input"))
    .map(i => i.value.trim()).filter(Boolean);

  const data = {
    id: editingId || uid(),
    name,
    spirit: document.getElementById("f-spirit").value.trim(),
    method: document.getElementById("f-method").value,
    glass: document.getElementById("f-glass").value.trim(),
    garnish: document.getElementById("f-garnish").value.trim(),
    ice: document.getElementById("f-ice").value.trim(),
    ingredients: ings,
    instructions: document.getElementById("f-instructions").value.trim()
  };

  if (editingId) {
    const idx = cocktails.findIndex(c => c.id === editingId);
    if (idx > -1) cocktails[idx] = data;
  } else {
    cocktails.push(data);
    cocktails.sort((a, b) => a.name.localeCompare(b.name));
  }

  const saved = await persistSave();

  saveBtn.textContent = "Save cocktail";
  saveBtn.disabled = false;

  closeModal();
  openId = data.id;
  render();
  showToast(saved
    ? (editingId ? "✓ Cocktail updated" : "✓ Cocktail added & saved")
    : "Added (storage unavailable — will reset on reload)"
  , 3000);
}

async function deleteCocktail(id) {
  const c = cocktails.find(x => x.id === id);
  if (!c) return;
  if (!confirm(`Delete "${c.name}"?`)) return;
  cocktails = cocktails.filter(x => x.id !== id);
  await persistSave();
  openId = null;
  render();
  showToast("Deleted");
}

document.getElementById("modal-bg").addEventListener("click", e => {
  if (e.target === e.currentTarget) closeModal();
});

load();
</script>
